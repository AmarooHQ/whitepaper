name: Build WP

on:
  workflow_call:
    inputs:
      build_release:
        required: true
        type: boolean
  # push:
  #   branches:
  #     - '*'

jobs:
  basic_build:
    runs-on: 'self-hosted'

    steps:
      - uses: actions/checkout@v2

      - name: build docker container
        shell: bash
        run: |
          make docker-build

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.14.9"

      # need to do this before we run bundle-for-wp in next step
      - name: purs tables check compiled
        if: ${{ inputs.build_release }}
        shell: bash
        run: |
          make purs-ci-check

      - name: "purescript tables generator"
        shell: bash
        run: |
          cd includes/ut/complexity/ut-complexity-gen-purs
          #LAMW_URL="https://raw.githubusercontent.com/XertroV/lambertw/7c65e241b353e296f58cdad774c77d500d0a11bd/lambertw.js"
          #curl "$LAMW_URL" > src/LambertW.js
          #echo "exports.gsl_sf_lambert_W0 = gsl_sf_lambert_W0;" >> src/LambertW.js
          spago test
          spago build
          npm run bundle-for-wp

      - name: build whitepaper
        shell: bash
        run: make docker "DOCKER_CMD=bash build.sh"

  lint_and_release:
    needs: basic_build
    runs-on: 'self-hosted'

    if: ${{ inputs.build_release }}

    steps:
      - name: set up linter
        shell: bash
        run: |
          make docker "DOCKER_CMD=bash -c 'make cilint-prep'"
          npm i
          make textlint

      - name: build release whitepaper (includes linting)
        shell: bash
        run: |
          make docker "DOCKER_CMD=bash -c 'make release'"
