[package]
name = "por-sim-rs"
version = "0.1.0"
authors = ["Max Kaye <m@xk.io>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = "2.33.3"
derive-new = "0.5.9"
env_logger = "0.8.3"
fnv = "1.0.7"
getrandom = "0.2.3"
hashbrown = "0.11.2"
