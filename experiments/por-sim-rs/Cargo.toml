[package]
name = "por-sim-rs"
version = "0.1.0"
authors = ["Max Kaye <m@xk.io>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
array_tool = "1.0.3"
blake3 = "1.3.1"
clap = "2.34.0"
conv = "0.3.3"
coz = "0.1.3"
crypto-hash = "0.3.4"
derive-new = "0.5.9"
env_logger = "0.9.0"
fnv = "1.0.7"
getrandom = "0.2.3"
hashbrown = "0.12.0"
hashers = "1.0.1"
im-rc = "15.0.0"
intmap = "0.7.0"
itertools = "0.10.0"
lazy_static = "1.4.0"
log = "0.4.14"
lru = "0.7.2"
non-empty-vec = "0.2.3"
num = "0.4.0"
rand = "0.8.3"
sha3 = "0.10.0"
twox-hash = "1.6.0"

[profile.release]
debug = true
# opt-level = 'z'  # Optimize for size.
